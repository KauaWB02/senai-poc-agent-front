<div class="min-h-screen bg-gray-50 dark:bg-slate-950 flex flex-col">
  <!-- HEADER -->
  <header
    class="h-16 px-8 flex items-center justify-between bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800"
  >
    <div class="flex items-center gap-3">
      <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
      <h1 class="text-sm font-semibold tracking-wide text-gray-900 dark:text-gray-100">
        Senai Agents
      </h1>
    </div>

    <button
      pButton
      type="button"
      [icon]="themeIcon"
      class="p-button-text"
      (click)="toggleTheme()"
      aria-label="Alternar tema"
    ></button>
  </header>

  <!-- CONTAINER -->
  <main class="flex-1 flex justify-center p-6">
    <!-- CHAT CARD -->
    <section
      class="w-full max-w-4xl flex flex-col bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm"
    >
      <!-- HISTORY -->
      <div class="flex-1 overflow-y-auto px-8 py-6 space-y-5">
        <ng-container *ngFor="let m of history">
          <div class="flex" [ngClass]="m.fromMe ? 'justify-end' : 'justify-start'">
            <!-- BUBBLE -->
            <div
              class="max-w-[65%] px-4 py-3 rounded-2xl text-sm leading-relaxed shadow-sm"
              [ngClass]="
                m.fromMe
                  ? 'bg-blue-600 text-white rounded-br-md'
                  : 'bg-gray-100 dark:bg-slate-800 text-gray-900 dark:text-gray-100 rounded-bl-md'
              "
            >
              <!-- TEXT -->
              <div *ngIf="m.text" class="whitespace-pre-wrap">
                {{ m.text }}
              </div>

              <!-- IMAGES -->
              <div *ngIf="m.images" class="mt-2 grid grid-cols-2 gap-2">
                <ng-container *ngFor="let img of m.images">
                  <img
                    [src]="img.url"
                    [alt]="img.name"
                    class="w-full h-28 object-cover rounded-lg border border-gray-200 dark:border-slate-700"
                  />
                </ng-container>
              </div>

              <!-- TIME -->
              <div class="mt-1 text-[10px] opacity-60 text-right">
                {{ m.timestamp | date: 'shortTime' }}
              </div>
            </div>
          </div>
        </ng-container>

        <div #historyEnd></div>
      </div>

      <!-- COMPOSER -->
      <div
        class="border-t border-gray-200 dark:border-slate-800 px-6 py-4 bg-white dark:bg-slate-900"
      >
        <!-- INPUT BOX -->
        <div
          class="flex items-end gap-3 bg-gray-50 dark:bg-slate-950 border border-gray-200 dark:border-slate-800 rounded-xl px-4 py-3"
        >
          <!-- TEXTAREA -->
          <textarea
            rows="2"
            [(ngModel)]="messageText"
            placeholder="Digite sua mensagem..."
            class="flex-1 resize-none bg-transparent outline-none text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500"
          ></textarea>

          <!-- ACTIONS -->
          <div class="flex gap-2 items-center">
            <!-- ATTACH -->
            <label
              class="w-9 h-9 flex items-center justify-center rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900 cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-800 transition"
            >
              <input
                type="file"
                accept="image/*"
                multiple
                (change)="onFilesSelected($event)"
                hidden
              />
              <i class="pi pi-paperclip text-sm text-gray-600 dark:text-gray-300"></i>
            </label>

            <!-- SEND -->
            <button
              pButton
              type="button"
              class="p-button-rounded p-button-primary"
              (click)="sendMessage()"
              aria-label="Enviar mensagem"
            >
              <span class="pi pi-send"></span>
            </button>
          </div>
        </div>

        <!-- PREVIEWS -->
        <div *ngIf="previews.length" class="mt-3 flex gap-3 overflow-x-auto">
          <div *ngFor="let p of previews; let i = index" class="relative group">
            <img
              [src]="p.url"
              [alt]="p.name"
              class="w-20 h-20 object-cover rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm"
            />

            <button
              type="button"
              (click)="removePreview(i)"
              class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-red-500 text-white text-[11px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition"
              aria-label="Remover imagem"
            >
              <i class="pi pi-times" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
